services:
  postgres:
    image: postgres:17
    container_name: task-time-tracker-db
    environment:
      POSTGRES_DB: ${DB_NAME:-task_time_tracker}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: